<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthPoint – Dashboard Pasien</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <a class="app-header__brand" href="dashboard-pasien.html" aria-label="HealthPoint">
      <span class="app-header__logo" role="img" aria-label="Logo HealthPoint"></span>
      <span class="app-header__text"><span class="app-header__title">HealthPoint</span></span>
    </a>
    <div class="app-header__actions">
      <button class="icon-button" type="button" aria-label="Notifikasi"><span class="icon icon--bell" aria-hidden="true"></span><span class="icon-button__dot" aria-hidden="true"></span></button>
      <span class="avatar-chip" role="img" aria-label="Profil"><span class="icon icon--user" aria-hidden="true"></span></span>
    </div>
  </header>

  <main class="page page--dashboard">
    <section class="greeting" aria-label="Sapaan">
      <span class="greeting__avatar"><span class="icon icon--user" aria-hidden="true"></span><span class="greeting__status" aria-hidden="true"></span></span>
      <div class="greeting__body">
        <h1 class="greeting__name">Halo, Budi Santoso <span class="icon icon--badge-check greeting__verified" aria-hidden="true"></span></h1>
        <span class="greeting__role">Pasien</span>
      </div>
    </section>

    <a class="nav-card" href="../pages/ui-04-cek-status-antrean.html">
      <div class="nav-card__row">
        <span class="nav-card__icon"><span class="icon icon--ticket" aria-hidden="true"></span></span>
        <h2 class="nav-card__title">Cek Status Antrean</h2>
      </div>
    </a>

    <section class="panel u-mt-6" aria-label="Daftar Layanan Klinik">
      <div class="panel__head">
        <h2 class="panel__title">Daftar Layanan Klinik</h2>
        <a class="panel__link" href="#">Semua</a>
      </div>
      <p class="panel__subtitle">Pilih poli klinik atau jadwal vaksinasi berkala</p>
      <div class="panel__list">
        <a class="service-card" href="../pages/ui-01-booking-antrean.html">
          <span class="service-card__icon"><span class="icon icon--stethoscope" aria-hidden="true"></span></span>
          <span class="service-card__body">
            <span class="service-card__title">Poli Umum</span>
            <span class="service-card__meta">Sesi Pagi</span>
          </span>
          <span class="service-card__aside">
            <span class="status-pill">Buka</span>
            <span class="round-action"><span class="icon icon--arrow-right" aria-hidden="true"></span></span>
          </span>
        </a>
        <a class="service-card" href="../pages/ui-11-pendaftaran-vaksinasi.html">
          <span class="service-card__icon"><span class="icon icon--syringe" aria-hidden="true"></span></span>
          <span class="service-card__body service-card__body--center">
            <span class="service-card__title">Vaksinasi</span>
          </span>
          <span class="service-card__aside">
            <span class="status-pill">Buka</span>
            <span class="round-action"><span class="icon icon--arrow-right" aria-hidden="true"></span></span>
          </span>
        </a>
      </div>
    </section>

    <a class="nav-card u-mt-4" href="../pages/ui-02-booking-aktif.html">
      <div class="nav-card__row">
        <span class="nav-card__icon"><span class="icon icon--ticket" aria-hidden="true"></span></span>
        <h2 class="nav-card__title">Booking Saya</h2>
      </div>
    </a>

    <a class="nav-card" href="../pages/ui-05-ketersediaan-dokter.html">
      <div class="nav-card__row">
        <span class="nav-card__icon"><span class="icon icon--calendar" aria-hidden="true"></span></span>
        <h2 class="nav-card__title">Jadwal Dokter</h2>
      </div>
    </a>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__link" href="dashboard-pasien.html"><span class="icon icon--dashboard" aria-hidden="true"></span><span class="bottom-nav__label">Dashboard</span></a>
      <a class="bottom-nav__link bottom-nav__link--compact" href="#"><span class="icon icon--user" aria-hidden="true"></span><span class="bottom-nav__label">Profil</span></a>
    </div>
  </nav>
</div>
</body>
</html>
