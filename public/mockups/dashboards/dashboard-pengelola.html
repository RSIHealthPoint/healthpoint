<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthPoint – Dashboard Pengelola Klinik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <a class="app-header__brand" href="dashboard-pengelola.html" aria-label="HealthPoint">
      <span class="app-header__logo" role="img" aria-label="Logo HealthPoint"></span>
      <span class="app-header__text"><span class="app-header__title">HealthPoint</span></span>
    </a>
    <div class="app-header__actions">
      <button class="icon-button" type="button" aria-label="Notifikasi"><span class="icon icon--bell" aria-hidden="true"></span><span class="icon-button__dot" aria-hidden="true"></span></button>
      <span class="avatar-chip" role="img" aria-label="Profil"><span class="icon icon--user" aria-hidden="true"></span></span>
    </div>
  </header>

  <main class="page page--dashboard">
    <section class="greeting" aria-label="Sapaan">
      <span class="greeting__avatar"><span class="icon icon--user" aria-hidden="true"></span><span class="greeting__status" aria-hidden="true"></span></span>
      <div class="greeting__body">
        <h1 class="greeting__name">Halo, Devita <span class="icon icon--badge-check greeting__verified" aria-hidden="true"></span></h1>
        <span class="greeting__role">Pengelola Klinik</span>
      </div>
    </section>

    <a class="nav-card" href="../pages/ui-14-laporan-harian.html">
      <div class="nav-card__row">
        <span class="nav-card__icon"><span class="icon icon--file-text" aria-hidden="true"></span></span>
        <h2 class="nav-card__title">Laporan Harian</h2>
      </div>
    </a>

    <section class="panel panel--manage u-mt-3" aria-label="Vaksinasi">
      <div class="panel__head">
        <h2 class="panel__title">Vaksinasi</h2>
      </div>
      <div class="panel__list">
        <a class="service-card" href="../pages/ui-10-update-stok-vaksin.html">
          <span class="service-card__icon"><span class="icon icon--package" aria-hidden="true"></span></span>
          <span class="service-card__body service-card__body--center">
            <span class="service-card__title">Kelola Stok Vaksin</span>
          </span>
          <span class="service-card__aside service-card__aside--center">
            <span class="round-action"><span class="icon icon--arrow-right" aria-hidden="true"></span></span>
          </span>
        </a>
        <a class="service-card" href="../pages/ui-15-laporan-kuota-vaksin.html">
          <span class="service-card__icon"><span class="icon icon--bar-chart" aria-hidden="true"></span></span>
          <span class="service-card__body service-card__body--center">
            <span class="service-card__title">Laporan Pemakaian</span>
          </span>
          <span class="service-card__aside service-card__aside--center">
            <span class="round-action"><span class="icon icon--arrow-right" aria-hidden="true"></span></span>
          </span>
        </a>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__link" href="dashboard-pengelola.html"><span class="icon icon--dashboard" aria-hidden="true"></span><span class="bottom-nav__label">Dashboard</span></a>
      <a class="bottom-nav__link bottom-nav__link--compact" href="#"><span class="icon icon--user" aria-hidden="true"></span><span class="bottom-nav__label">Profil</span></a>
    </div>
  </nav>
</div>
</body>
</html>
