<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthPoint – Status Pasien Saat Ini (UI-03)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <a class="app-header__brand" href="../dashboards/dashboard-petugas.html" aria-label="HealthPoint">
      <span class="app-header__logo" role="img" aria-label="Logo HealthPoint"></span>
      <span class="app-header__text"><span class="app-header__title">HealthPoint</span></span>
    </a>
    <div class="app-header__actions">
      <button class="icon-button" type="button" aria-label="Notifikasi"><span class="icon icon--bell" aria-hidden="true"></span><span class="icon-button__dot" aria-hidden="true"></span></button>
      <span class="avatar-chip" role="img" aria-label="Profil"><span class="icon icon--user" aria-hidden="true"></span></span>
    </div>
  </header>

  <main class="page page--queue">
    <div class="queue-head">
      <span class="icon icon--users" aria-hidden="true"></span>
      <h1 class="queue-head__title">Status Pasien Saat Ini</h1>
    </div>

    <section class="hero-card" aria-label="Pasien yang sedang dipanggil">
      <div class="call-status">
        <div>
          <p class="call-status__label">Nomor Antrean Aktif</p>
          <p class="call-status__number"><span class="call-status__code">A-014</span><span class="call-status__poli">Poli Umum</span></p>
        </div>
        <span class="call-status__icon"><span class="icon icon--volume" aria-hidden="true"></span></span>
      </div>

      <div class="patient-identity">
        <span class="patient-identity__avatar" aria-hidden="true">SR</span>
        <div>
          <p class="patient-identity__name">Siti Rahmawati</p>
          <p class="patient-identity__meta">Perempuan • 34 Tahun</p>
        </div>
      </div>

      <div class="action-stack">
        <button class="btn btn--primary" type="button"><span class="icon icon--refresh" aria-hidden="true"></span>Panggil Ulang</button>
        <button class="btn btn--teal" type="button"><span class="icon icon--user-check" aria-hidden="true"></span>Tandai Hadir / Masuk Poli</button>
        <div class="action-stack__skip">
          <button class="btn btn--soft-danger" type="button"><span class="icon icon--skip" aria-hidden="true"></span>Lewati Pasien</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__link" href="../dashboards/dashboard-petugas.html"><span class="icon icon--dashboard" aria-hidden="true"></span><span class="bottom-nav__label">Dashboard</span></a>
      <a class="bottom-nav__link bottom-nav__link--compact" href="#"><span class="icon icon--user" aria-hidden="true"></span><span class="bottom-nav__label">Profil</span></a>
    </div>
  </nav>
</div>
</body>
</html>
