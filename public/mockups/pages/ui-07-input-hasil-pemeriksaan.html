<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthPoint – Hasil Pemeriksaan &amp; Tindakan (UI-07)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <a class="app-header__brand" href="../dashboards/dashboard-dokter.html" aria-label="HealthPoint">
      <span class="app-header__logo" role="img" aria-label="Logo HealthPoint"></span>
      <span class="app-header__text">
        <span class="app-header__title">HealthPoint</span>
        <span class="app-header__subtitle">Klinik Pratama</span>
      </span>
    </a>
    <div class="app-header__actions">
      <button class="icon-button" type="button" aria-label="Notifikasi"><span class="icon icon--bell" aria-hidden="true"></span><span class="icon-button__dot" aria-hidden="true"></span></button>
      <span class="avatar-chip" role="img" aria-label="Profil"><span class="icon icon--user" aria-hidden="true"></span></span>
    </div>
  </header>

  <main class="page page--clinical">
    <section aria-label="Pencarian pasien">
      <h1 class="lookup__title"><span class="icon icon--eye" aria-hidden="true"></span>Cari Data Pasien</h1>
      <div class="lookup__field">
        <input class="lookup__input" type="text" name="pasien" aria-label="Nama pasien" value="Budi Santoso">
        <span class="lookup__icon icon icon--search" aria-hidden="true"></span>
        <button class="lookup__clear" type="button" aria-label="Bersihkan pencarian"><span class="icon icon--x" aria-hidden="true"></span></button>
      </div>
      <button class="btn btn--teal btn--sm lookup__submit" type="button"><span class="icon icon--user-check" aria-hidden="true"></span>Cari Pasien</button>
    </section>

    <section class="patient-card" aria-label="Identitas dan triase pasien">
      <div class="patient-card__head">
        <span class="patient-card__avatar"><span class="icon icon--user" aria-hidden="true"></span></span>
        <div>
          <div class="patient-card__name-row">
            <h2 class="patient-card__name">Budi Santoso</h2>
            <span class="tag">RM-0014</span>
          </div>
          <p class="patient-card__meta">Usia:<strong>38 Tahun</strong></p>
        </div>
      </div>

      <div class="info-box">
        <p class="info-box__title"><span class="icon icon--clipboard" aria-hidden="true"></span>Keluhan Utama</p>
        <p class="info-box__text">Demam 3 hari disertai batuk pilek.</p>
      </div>

      <div class="vitals">
        <div class="vital"><span class="vital__label">TD</span><span class="vital__value">120/80</span><span class="vital__unit">mmHg</span></div>
        <div class="vital"><span class="vital__label">Nadi</span><span class="vital__value">88</span><span class="vital__unit">bpm</span></div>
        <div class="vital vital--alert"><span class="vital__label">Suhu</span><span class="vital__value">38.5</span><span class="vital__unit">°C</span></div>
        <div class="vital"><span class="vital__label">SpO2</span><span class="vital__value">98%</span><span class="vital__unit">Normal</span></div>
      </div>
    </section>

    <form action="ui-09-notifikasi-berhasil.html" method="get">
      <section class="findings" aria-label="Hasil pemeriksaan dan tindakan">
        <div class="findings__head">
          <span class="findings__icon"><span class="icon icon--clipboard" aria-hidden="true"></span></span>
          <h2 class="findings__title">Hasil Pemeriksaan &amp; Tindakan</h2>
        </div>
        <div class="findings__group">
          <div class="findings__label-row"><label class="findings__label" for="diagnosis">Diagnosis Utama *</label></div>
          <textarea class="findings__field findings__field--single" id="diagnosis" name="diagnosis" rows="1" required>ISPA Akut / Faringitis Akut</textarea>
        </div>
        <div class="findings__group">
          <div class="findings__label-row">
            <label class="findings__label" for="tindakan">Tindakan &amp; Terapi</label>
            <span class="findings__hint">Catatan Dokter</span>
          </div>
          <textarea class="findings__field findings__field--double" id="tindakan" name="tindakan" rows="2">Pemberian antipiretik, vitamin C, nebulizer 1x, edukasi istirahat cukup.</textarea>
        </div>
      </section>

      <div class="toggle-row">
        <span class="toggle-row__label"><span class="icon icon--calendar-check" aria-hidden="true"></span>Jadwalkan Kontrol Ulang</span>
        <label class="switch">
          <input class="switch__input" type="checkbox" name="kontrol" role="switch" aria-label="Jadwalkan Kontrol Ulang">
          <span class="switch__track" aria-hidden="true"></span>
        </label>
      </div>

      <button class="btn btn--primary btn--save" type="submit"><span class="icon icon--save" aria-hidden="true"></span>Simpan Data Layanan</button>
    </form>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__link" href="../dashboards/dashboard-dokter.html"><span class="icon icon--dashboard" aria-hidden="true"></span><span class="bottom-nav__label">Dashboard</span></a>
      <a class="bottom-nav__link bottom-nav__link--compact" href="#"><span class="icon icon--user" aria-hidden="true"></span><span class="bottom-nav__label">Profil</span></a>
    </div>
  </nav>
</div>
</body>
</html>
