<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthPoint – Cari Pasien (UI-12)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <a class="app-header__brand" href="../dashboards/dashboard-petugas.html" aria-label="HealthPoint">
      <span class="app-header__logo" role="img" aria-label="Logo HealthPoint"></span>
      <span class="app-header__text"><span class="app-header__title">HealthPoint</span></span>
    </a>
    <div class="app-header__actions">
      <button class="icon-button" type="button" aria-label="Notifikasi"><span class="icon icon--bell" aria-hidden="true"></span><span class="icon-button__dot" aria-hidden="true"></span></button>
      <span class="avatar-chip" role="img" aria-label="Profil"><span class="icon icon--user" aria-hidden="true"></span></span>
    </div>
  </header>

  <main class="page page--search">
    <form class="search-card" action="ui-13-ringkasan-riwayat-pasien.html" method="get">
      <label class="search-card__label" for="nama-pasien">Nama Pasien</label>
      <div class="lookup__field">
        <input class="lookup__input" id="nama-pasien" name="nama" type="text" value="Budi Santoso">
        <span class="lookup__icon icon icon--search" aria-hidden="true"></span>
      </div>

      <div class="search-card__row">
        <div class="search-card__col">
          <label class="search-card__label" for="tanggal-lahir">Tanggal Lahir:</label>
          <div class="static-field">
            <span class="icon icon--calendar" aria-hidden="true"></span>
            <input class="static-field__input" id="tanggal-lahir" name="lahir" type="text" value="14/05/1988">
          </div>
        </div>
        <div class="search-card__col">
          <label class="search-card__label" for="no-rm">No. Rekam Medis (RM):</label>
          <div class="static-field">
            <span class="icon icon--id-card" aria-hidden="true"></span>
            <input class="static-field__input" id="no-rm" name="rm" type="text" value="RM-2026-0014">
          </div>
        </div>
      </div>

      <button class="btn btn--form" type="submit">Cari Pasien</button>
    </form>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__link" href="../dashboards/dashboard-petugas.html"><span class="icon icon--dashboard" aria-hidden="true"></span><span class="bottom-nav__label">Dashboard</span></a>
      <a class="bottom-nav__link bottom-nav__link--compact" href="#"><span class="icon icon--user" aria-hidden="true"></span><span class="bottom-nav__label">Profil</span></a>
    </div>
  </nav>
</div>
</body>
</html>
