<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthPoint – Atur Kontrol Ulang (UI-08)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <a class="app-header__brand" href="dashboard-dokter.html" aria-label="HealthPoint">
      <span class="app-header__logo" role="img" aria-label="Logo HealthPoint"></span>
      <span class="app-header__text">
        <span class="app-header__title">HealthPoint</span>
        <span class="app-header__subtitle">Klinik Pratama</span>
      </span>
    </a>
    <div class="app-header__actions">
      <button class="icon-button" type="button" aria-label="Notifikasi"><span class="icon icon--bell" aria-hidden="true"></span><span class="icon-button__dot" aria-hidden="true"></span></button>
      <span class="avatar-chip" role="img" aria-label="Profil"><span class="icon icon--user" aria-hidden="true"></span></span>
    </div>
  </header>

  <main class="page page--followup">
    <form action="ui-09-notifikasi-berhasil.html" method="get">
      <div class="toggle-row">
        <span class="toggle-row__label"><span class="icon icon--calendar-check" aria-hidden="true"></span>Jadwalkan Kontrol Ulang</span>
        <label class="switch">
          <input class="switch__input" type="checkbox" name="kontrol" role="switch" aria-label="Jadwalkan Kontrol Ulang" checked>
          <span class="switch__track" aria-hidden="true"></span>
        </label>
      </div>

      <section class="followup-card" aria-label="Penetapan kontrol ulang">
        <div class="followup-card__head">
          <span class="followup-card__icon"><span class="icon icon--calendar" aria-hidden="true"></span></span>
          <h1 class="followup-card__title">Penetapan Kontrol Ulang</h1>
        </div>

        <div class="followup-panel">
          <div class="followup-panel__group">
            <label class="followup-panel__label" for="tanggal-kontrol">Pilih Tanggal:</label>
            <select class="select-plain" id="tanggal-kontrol" name="tanggal"><option selected>8 Oktober 2026</option><option>9 Oktober 2026</option><option>12 Oktober 2026</option></select>
          </div>
          <div class="followup-panel__group">
            <label class="followup-panel__label" for="poli-kontrol">Poli:</label>
            <select class="select-plain" id="poli-kontrol" name="poli"><option selected>Poli Umum</option></select>
          </div>
          <div class="followup-panel__group">
            <label class="followup-panel__label" for="jam-kontrol">Jam:</label>
            <select class="select-plain" id="jam-kontrol" name="jam"><option selected>09:00 - 11:30</option></select>
          </div>
        </div>

        <div class="note-box">
          <span class="note-box__icon icon icon--info" aria-hidden="true"></span>
          <p class="note-box__text">Tanggal kontrol yang ditetapkan akan otomatis tersinkronisasi ke daftar booking &amp; kontrol pasien saat data disimpan. Pasien akan menerima notifikasi pengingat via aplikasi HealthPoint.</p>
        </div>
      </section>

      <button class="btn btn--primary btn--save u-mt-6" type="submit"><span class="icon icon--save" aria-hidden="true"></span>Simpan Data Layanan</button>
    </form>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__link" href="dashboard-dokter.html"><span class="icon icon--dashboard" aria-hidden="true"></span><span class="bottom-nav__label">Dashboard</span></a>
      <a class="bottom-nav__link bottom-nav__link--compact" href="#"><span class="icon icon--user" aria-hidden="true"></span><span class="bottom-nav__label">Profil</span></a>
    </div>
  </nav>
</div>
</body>
</html>
