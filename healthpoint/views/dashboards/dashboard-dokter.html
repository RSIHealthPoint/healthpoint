<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthPoint – Dashboard Dokter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <a class="app-header__brand" href="dashboard-dokter.html" aria-label="HealthPoint">
      <span class="app-header__logo" role="img" aria-label="Logo HealthPoint"></span>
      <span class="app-header__text">
        <span class="app-header__title">HealthPoint</span>
        <span class="app-header__subtitle">Klinik Pratama</span>
      </span>
    </a>
    <div class="app-header__actions">
      <button class="icon-button" type="button" aria-label="Notifikasi"><span class="icon icon--bell" aria-hidden="true"></span><span class="icon-button__dot" aria-hidden="true"></span></button>
      <span class="avatar-chip" role="img" aria-label="Profil"><span class="icon icon--user" aria-hidden="true"></span></span>
    </div>
  </header>

  <main class="page page--dashboard">
    <section class="greeting" aria-label="Sapaan">
      <span class="greeting__avatar"><span class="icon icon--user" aria-hidden="true"></span><span class="greeting__status" aria-hidden="true"></span></span>
      <div class="greeting__body">
        <h1 class="greeting__name">Halo, dr. Loveinda <span class="icon icon--badge-check greeting__verified" aria-hidden="true"></span></h1>
        <span class="greeting__role">Dokter</span>
      </div>
    </section>

    <section class="panel panel--doctor u-mt-26" aria-label="Data Layanan">
      <div class="panel__head">
        <h2 class="panel__title">Data Layanan</h2>
      </div>
      <div class="panel__list">
        <a class="finding-card" href="ui-07-input-hasil-pemeriksaan.html">
          <span class="finding-card__icon"><span class="icon icon--clipboard" aria-hidden="true"></span></span>
          <span class="finding-card__title">Hasil Pemeriksaan &amp; Tindakan</span>
        </a>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__link" href="dashboard-dokter.html"><span class="icon icon--dashboard" aria-hidden="true"></span><span class="bottom-nav__label">Dashboard</span></a>
      <a class="bottom-nav__link bottom-nav__link--compact" href="#"><span class="icon icon--user" aria-hidden="true"></span><span class="bottom-nav__label">Profil</span></a>
    </div>
  </nav>
</div>
</body>
</html>
