<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthPoint – Login Akun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <a class="app-header__brand" href="login.html" aria-label="HealthPoint">
      <span class="app-header__logo" role="img" aria-label="Logo HealthPoint"></span>
      <span class="app-header__text"><span class="app-header__title">HealthPoint</span></span>
    </a>
    <div class="app-header__actions">
      <button class="icon-button" type="button" aria-label="Notifikasi"><span class="icon icon--bell" aria-hidden="true"></span><span class="icon-button__dot" aria-hidden="true"></span></button>
      <span class="avatar-chip" role="img" aria-label="Profil"><span class="icon icon--user" aria-hidden="true"></span></span>
    </div>
  </header>

  <main class="page page--login">
    <div class="login">
      <div class="login__aura" aria-hidden="true"></div>
      <h1 class="login__title">Login Akun</h1>

      <form class="login__form" id="login-form" action="dashboard-pasien.html" method="get">
        <fieldset class="role-tabs">
          <legend class="visually-hidden">Masuk sebagai</legend>
          <input class="role-tabs__input" type="radio" name="role" id="role-pasien" value="dashboard-pasien.html" checked>
          <label class="role-tabs__label" for="role-pasien">Pasien</label>
          <input class="role-tabs__input" type="radio" name="role" id="role-petugas" value="dashboard-petugas.html">
          <label class="role-tabs__label" for="role-petugas">Petugas</label>
          <input class="role-tabs__input" type="radio" name="role" id="role-dokter" value="dashboard-dokter.html">
          <label class="role-tabs__label" for="role-dokter">Dokter</label>
          <input class="role-tabs__input" type="radio" name="role" id="role-pengelola" value="dashboard-pengelola.html">
          <label class="role-tabs__label" for="role-pengelola">Pengelola</label>
        </fieldset>

        <div class="login-card">
          <div class="form-stack">
            <div class="field">
              <div class="field__row"><label class="field__label" for="identifier">Email/No. HP</label></div>
              <div class="input-wrap">
                <input class="input" id="identifier" name="identifier" type="text" autocomplete="username" value="0812-4451-8890">
                <span class="input-wrap__icon icon icon--mail" aria-hidden="true"></span>
              </div>
            </div>

            <div class="field">
              <div class="field__row">
                <label class="field__label" for="password">Kata Sandi atau PIN</label>
                <a class="field__link" href="#">Lupa Kata Sandi?</a>
              </div>
              <div class="input-wrap">
                <input class="input input--password" id="password" name="password" type="password" autocomplete="current-password" value="123456">
                <span class="input-wrap__icon icon icon--lock" aria-hidden="true"></span>
                <button class="input-wrap__toggle" id="toggle-password" type="button" aria-label="Lihat kata sandi"><span class="icon icon--eye" aria-hidden="true"></span></button>
              </div>
            </div>

            <label class="check"><input class="check__box" type="checkbox" name="remember"><span>Ingat saya di perangkat ini</span></label>

            <div class="form-actions">
              <button class="btn btn--login" type="submit">Masuk ke Akun <span class="icon icon--arrow-right" aria-hidden="true"></span></button>
            </div>
          </div>
        </div>
      </form>

      <section class="register-card" aria-label="Pendaftaran akun">
        <span class="register-card__icon"><span class="icon icon--user-plus" aria-hidden="true"></span></span>
        <div class="register-card__body">
          <h2 class="register-card__title">Belum memiliki akun?</h2>
          <a class="register-card__link" href="#">Daftar Akun Baru di sini <span class="icon icon--arrow-right" aria-hidden="true"></span></a>
        </div>
      </section>
    </div>
  </main>
</div>
<script>
  // Arahkan ke dashboard sesuai peran yang dipilih
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var role = this.querySelector('input[name="role"]:checked');
    window.location.href = role ? role.value : 'dashboard-pasien.html';
  });
  // Tampilkan / sembunyikan kata sandi
  document.getElementById('toggle-password').addEventListener('click', function () {
    var input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  });
</script>
</body>
</html>
