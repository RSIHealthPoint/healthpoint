<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthPoint – Laporan Harian Jumlah Pasien (UI-14)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <a class="app-header__brand" href="dashboard-pengelola.html" aria-label="HealthPoint">
      <span class="app-header__logo" role="img" aria-label="Logo HealthPoint"></span>
      <span class="app-header__text"><span class="app-header__title">HealthPoint</span></span>
    </a>
    <div class="app-header__actions">
      <button class="icon-button" type="button" aria-label="Notifikasi"><span class="icon icon--bell" aria-hidden="true"></span><span class="icon-button__dot" aria-hidden="true"></span></button>
      <span class="avatar-chip" role="img" aria-label="Profil"><span class="icon icon--user" aria-hidden="true"></span></span>
    </div>
  </header>

  <main class="page page--report">
    <section class="report-card" aria-label="Laporan harian jumlah pasien">
      <div class="report-head">
        <h1 class="report-card__title"><span class="icon icon--bar-chart" aria-hidden="true"></span>Laporan Harian Jumlah Pasien</h1>
        <div class="date-picker">
          <span class="date-picker__label">Pilih Tanggal Laporan:</span>
          <button class="date-chip" type="button"><span class="icon icon--calendar" aria-hidden="true"></span>01 Okt 2026</button>
        </div>
      </div>

      <div class="progress-list">
        <div class="progress-row">
          <div class="progress-row__top">
            <span class="progress-row__name"><span class="icon icon--stethoscope" aria-hidden="true"></span>Poli Umum</span>
            <span class="progress-row__stat">26 <span class="progress-row__unit">Kunjungan</span><span class="progress-row__percent">87%</span></span>
          </div>
          <div class="progress" role="progressbar" aria-label="Poli Umum" aria-valuenow="87" aria-valuemin="0" aria-valuemax="100"><span class="progress__bar" style="width:86.6%"></span></div>
          <span class="progress-row__target">Target Harian: 30</span>
        </div>

        <div class="progress-row progress-row--teal">
          <div class="progress-row__top">
            <span class="progress-row__name"><span class="icon icon--smile" aria-hidden="true"></span>Poli Gigi</span>
            <span class="progress-row__stat">20 <span class="progress-row__unit">Kunjungan</span><span class="progress-row__percent">80%</span></span>
          </div>
          <div class="progress" role="progressbar" aria-label="Poli Gigi" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"><span class="progress__bar" style="width:80%"></span></div>
          <span class="progress-row__target">Target Harian: 25</span>
        </div>

        <div class="progress-row progress-row--violet">
          <div class="progress-row__top">
            <span class="progress-row__name"><span class="icon icon--syringe" aria-hidden="true"></span>Layanan Vaksin</span>
            <span class="progress-row__stat">14 <span class="progress-row__unit">Kunjungan</span><span class="progress-row__percent">70%</span></span>
          </div>
          <div class="progress" role="progressbar" aria-label="Layanan Vaksin" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100"><span class="progress__bar" style="width:70%"></span></div>
          <span class="progress-row__target">Target Harian: 20</span>
        </div>
      </div>

      <div class="export-actions">
        <button class="btn btn--export" type="button"><span class="icon icon--download" aria-hidden="true"></span>Unduh Laporan Harian (PDF/Excel)</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__link" href="dashboard-pengelola.html"><span class="icon icon--dashboard" aria-hidden="true"></span><span class="bottom-nav__label">Dashboard</span></a>
      <a class="bottom-nav__link bottom-nav__link--compact" href="#"><span class="icon icon--user" aria-hidden="true"></span><span class="bottom-nav__label">Profil</span></a>
    </div>
  </nav>
</div>
</body>
</html>
